<!-- Epiaka - logo principal, para fundos claros. Para fundos escuros use epiaka-logo-dark.svg.
     Cores explicitas de proposito: prefers-color-scheme dentro de <img> segue o tema do
     sistema, nao o fundo onde a marca esta aplicada. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.5 -160.4 622.4 213.2" width="622" height="213" role="img" aria-label="Epiaka">
  <!-- Simbolo: traco fino (8.2) por contraste deliberado com o peso do logotipo (15). -->
  <g transform="translate(0,-50)">
    <g fill="none" stroke="#111614" stroke-width="8.2" stroke-linecap="round">
      <path d="M0 -98.3V90.7"/>
      <path d="M0 0 96.3 -76.3"/>
      <path d="M0 0 96.3 79.3"/>
    </g>
    <circle r="18.5" fill="#44C995"/>
  </g>
  <!-- Logotipo geometrico em contornos: altura de caixa 100, x-height 73, peso 15. -->
  <g transform="translate(172.4,0)">
    <g fill="none" stroke="#111614" stroke-width="15">
      <path d="M7.5 -100V0"/><path d="M7.5 -92.5H60"/><path d="M7.5 -50H53"/><path d="M7.5 -7.5H60"/>
      <path d="M85.5 -73V28"/><circle cx="114.5" cy="-36.5" r="29"/>
      <path d="M169.5 -73V0"/>
      <circle cx="224.5" cy="-36.5" r="29"/><path d="M253.5 -73V0"/>
      <path d="M279.5 -100V0"/><path d="M279.5 -32 320 -73"/><path d="M279.5 -32 324 0"/>
      <circle cx="379" cy="-36.5" r="29"/><path d="M408 -73V0"/>
    </g>
    <circle cx="169.5" cy="-95" r="9" fill="#111614"/>
  </g>
</svg>
